# Mindmory native memory — DeepSeek Harness profile patch (template).
#
# Paste this block into BOTH of these files, then restart the harness
# (or start a new session):
#
#     ~/.dsh/profiles/web/cordis.patch.yml
#     ~/.dsh/profiles/headless/cordis.patch.yml
#
# The dsh loader merges each profile's patch after every bundle layer. This
# single plugin performs strict prompt-time retrieval and two-sided archival
# without exposing any Mindmory tool schema to the model.
#
# REPLACE <ABSOLUTE-PATH-TO-DIST> with the extracted package directory. No
# endpoint or token belongs in the Harness profile; the adapter reads the
# protected adjacent mindmory-config.sh and scrubs credential-like child
# environment variables.
- insert:
    - id: mindmory-native-relay
      name: <ABSOLUTE-PATH-TO-DIST>/dsh/checkpoint-relay.mjs
      config:
        maxChars: 320
        timeoutMs: 10000
